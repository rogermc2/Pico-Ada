name					= "pico_xbsp_test_lt"
description				= "Light tasking test create for Pico_XBSP"
long-description			= """This create testes Pico_XBSP with the light tasking runtime

Included tests:

1) Pico.Debug_IO.Test - tests Pico.Debug_IO Debug I/O functionality
2) Pico.Tone.Test - tests Pico.Tone PWM tone generator
3) Pico.UART_IO.Test - tests Pico.UART_IO UART I/O functionality
4) Pico.USB_IO.Test - tests Pico.USB_IO USB I/O functionality

"""
version					= "1.9.0"
licenses				= "GPL-3.0-or-later"
authors					= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers				= ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers-logins			= ["krischik"]
website					= "https://pi-ada-tutorial.sourceforge.io"
tags					= ["raspberry", "pi", "pico", "rp2040", "tasking", "light-tasking", "ada2022", "embedded"]
executables				= [
    "pico-debug_io-test",
    "pico-tone-test",
    "pico-uart_io-test",
    "pico-usb_io-test"
]

[build-switches]
"*".ada_version				= ["-gnat2022"]
development.compile_checks		= "Warnings"
development.contracts			= "Yes"
development.runtime_checks		= "Overflow"
release.compile_checks			= "Warnings"
release.contracts			= "No"
release.runtime_checks			= "Default"
validation.compile_checks		= "Warnings"
validation.contracts			= "Yes"
validation.runtime_checks		= "Everything"

[[depends-on]]
adacl_embedded				= "^7.1.2"
rp2040_hal				= "^2.7.1"
pico_bsp				= "^2.2"
pico_xbsp				= "^1.9"
light_tasking_rp2040			= "^15.4"
usb_embedded				= "1.1.0-mk.2"

[[pins]]
#adacl_embedded				= { path='../../../../AdaCL/develop/adacl_embedded' }
pico_xbsp				= { path='..' }
# usb_embedded				= { path='../../../usb_embedded' }

[configuration.values]
adacl_embedded.Event_Log_Buffer_Size	= 0
adacl_embedded.Variant			= "no_tasking"
light_tasking_rp2040.Board		= "rpi_pico"
light_tasking_rp2040.Max_CPUs		= 2
pico_xbsp.Event_Log_Output		= "usb"
pico_xbsp.Variant			= "tasking"
rp2040_hal.Interrupts			= "bb_runtimes"
rp2040_hal.Use_Startup			= false
usb_embedded.Event_Log_Buffer_Size	= 0
usb_embedded.Log_Verbose		= false

[gpr-set-externals]
LIGHT_TASKING_RP2040_BUILD		= "Production"

