  [[menu.main]]
    name			= "Sourceforge"
    url				= "https://sourceforge.net/projects/pi-ada-tutorial/"
    weight			= 10
    [menu.main.params]
      icon			= "sourceforge"
      showName			= false
      target			= "_blank"
