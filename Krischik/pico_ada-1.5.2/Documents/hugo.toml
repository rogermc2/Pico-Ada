baseURL				= 'https://pi-ada-tutorial.sourceforge.io/'
enableRobotsTXT			= true
languageCode			= 'en-gb'
theme				= 'congo'
title				= 'Pi Ada Tutorial'

[params]
  enableCodeCopy		= true
  enableRobotsTXT		= false
  minimal			= false
  excerpts			= true
  description			= "Raspberry Pi Ada Tutorial"
  colorScheme			= 'fire'
  [params.header]
    layout			= 'basic'
    logo			= 'images/cover.png'
  [params.list]
    showSummary			= true
    showTableOfContents		= true
  [params.article]
    showAuthor			= true
    showPagination		= true
    showReadingTime		= false
    showTableOfContents		= true
    showDateUpdated		= true
  [params.homepage]
    layout			= "page"
  [params.hugomods.images]
    modern_format		= 'webp'
    class_name			= 'mx-auto my-1 rounded-md'
    alignment_end_class_name	= 'float-right'
    alignment_start_class_name	= 'float-left'
  [params.author]
    name			= 'Martin Krischik'
    email			= 'krischik@users.sourceforge.net'
    image			= 'images/Google-Avatar.png'
    links			= [
      { link	 = "http://fx-602p.krischik.com/"	      },
      { minds	 = "https://www.minds.com/krischik"	      },
      { mewe	 = "https://mewe.com/martinkrischik"	      },
      { steemit  = "https://steemit.com/@krischik"	      },
      { hive	 = "https://hive.blog/@krischik"	      },
      { blurt	 = "https://blurt.blog/@krischik"	      },
      { twitter  = "https://twitter.com/martin_krischik"      },
      { facebook = "https://www.facebook.com/martin.krischik" },
      { youtube  = "https://youtube.com/@Martin.Krischik"     }
    ]

[markup]
  [markup.tableOfContents]
    startLevel			= 2
    endLevel			= 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe			= true

[taxonomies]
  category			= 'categories'
  tag				= 'tags'
  author			= 'authors'

