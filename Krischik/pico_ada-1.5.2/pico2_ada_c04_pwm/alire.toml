name                            = "pico2_ada_c04_pwm"
description                     = "Chapter 4: Analog & PWM"
long-description                = """

Contained in Chapter 04 reloaded are:

2. sketch_04_1_breathing_light - Chapter 4.1 Blink internal LED
2. sketch_04_2_flowing_light_2 - Chapter 4.2 Comet light bar.

GNATdoc documentation:
https://pi-ada-tutorial.sourceforge.io/gnatdoc/pico2_ada_c04_pwm/

SourceForge repository:
https://sourceforge.net/projects/pi-ada-tutorial/
"""

version                         = "1.5.2"
licenses                        = "GPL-3.0-or-later"
authors                         = ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers                     = ["Martin Krischik <krischik@users.sourceforge.net>"]
maintainers-logins              = ["krischik"]
website                         = "https://pi-ada-tutorial.sourceforge.io/pico2_ada_c04_pwm"
tags                            = ["raspberry", "pi", "pico2", "rp2350", "tasking", "light-tasking", "ada2022", "embedded"]
executables                     = [
    "sbreathing_2_lights",
    "sketch_04_1_breathing_light",
    "sketch_04_2_flowing_light_2"
]

[build-switches]
"*".ada_version                 = ["-gnat2022"]
development.compile_checks      = "Warnings"
development.contracts           = "Yes"
development.runtime_checks      = "Overflow"
release.compile_checks          = "Warnings"
release.contracts               = "No"
release.runtime_checks          = "Default"
validation.compile_checks       = "Warnings"
validation.contracts            = "Yes"
validation.runtime_checks       = "Everything"

[[depends-on]]
pico_bsp                        = "^3.0.0-alpha1"
rp2040_hal                      = "^3.0.0-alpha1"
light_tasking_rp2350            = "^15.3"

[[pins]]
# pico_bsp                      = { path='../Library/pico_bsp'   }
# rp2040_hal                    = { path='../Library/rp2040_hal' }
pico_bsp                        = { url='https://github.com/krischik/pico_bsp',    branch='develop' }
rp2040_hal                      = { url='https://github.com/krischik/rp2040_hal',  branch='3.x'     }

[configuration.values]
pico_bsp.device                 = "RP2350A"
rp2040_hal.device               = "RP2350A"
light_tasking_rp2350.Max_CPUs   = 2
light_tasking_rp2350.Board      = "rpi_pico2"

